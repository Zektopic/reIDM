[workspace]
resolver = "2"
members = ["crates/reidm-proto", "crates/reidm-core", "crates/reidm", "crates/reidm-host", "crates/reidm-gui"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Zektopic/reIDM"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "sync", "time", "signal", "process"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "cookies", "blocking", "json"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
url = "2"
percent-encoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
