<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --mut: #6c6c6c; --line: #d8d8d8;
    --accent: #0a60c8; --ok: #2ea053; --warn: #b06a00; --err: #c02828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #242427; --fg: #e6e6e6; --mut: #9a9a9a; --line: #3c3c3c; --accent: #2a84e0; }
  }
  * { box-sizing: border-box; }
  body {
    width: 420px; max-height: 560px; margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg);
  }
  header img { width: 18px; height: 18px; }
  header .name { font-weight: 600; }
  header .sp { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 12px; }
  main { padding: 8px 12px 12px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row input[type=checkbox] { flex: none; }
  .row .meta { min-width: 0; flex: 1; }
  .row .fn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .url { color: var(--mut); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px;
    border: 1px solid currentColor; border-radius: 99px; flex: none;
  }
  .kind.stream { color: #8b5cf6; } .kind.video, .kind.media { color: var(--accent); }
  .kind.audio { color: #e04a9b; } .kind.link { color: var(--ok); }
  .kind.segment { color: var(--mut); } .kind.mse { color: var(--warn); }
  .empty { color: var(--mut); text-align: center; padding: 26px 10px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: .5; cursor: default; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input {
    flex: 1; font: inherit; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: transparent; color: var(--fg);
  }
  .msg { margin-top: 8px; font-size: 12px; color: var(--mut); min-height: 16px; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="icons/48.png" alt="">
  <span class="name">reIDM</span>
  <span class="sp"></span>
  <span class="status"><span id="dot" class="dot" style="background:#9a9a9a"></span><span id="statusText">checking…</span></span>
</header>
<main>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
    <label class="toggle"><input type="checkbox" id="capture"> Capture downloads</label>
    <span class="sp" style="flex:1"></span>
    <button id="clear" title="Forget the media found on this page">Clear</button>
  </div>

  <div id="list"></div>

  <div class="actions">
    <button class="primary" id="downloadSelected">Download selected</button>
    <button id="downloadAll">Download all</button>
    <span class="sp" style="flex:1"></span>
    <button id="options">Options</button>
  </div>

  <div class="add">
    <input id="url" type="text" placeholder="…or paste a link and press Enter" spellcheck="false">
    <button id="addUrl">Add</button>
  </div>

  <div id="msg" class="msg"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
