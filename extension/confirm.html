<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download file info — reIDM</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1d21; --mut: #69707d; --line: #e3e6eb; --soft: #f4f6f9;
    --accent: #1565d8; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f2125; --fg: #e7e9ee; --mut: #9aa1ad; --line: #33363d; --soft: #272a30; --accent: #3b8cff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 9px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  header img { width: 22px; height: 22px; }
  header .name { font-weight: 650; font-size: 14px; }
  main { flex: 1; padding: 12px 16px 6px; display: grid; grid-template-columns: 74px 1fr; gap: 9px 10px; align-content: start; }
  .k { color: var(--mut); padding-top: 5px; }
  .v { min-width: 0; padding-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=text] { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--soft); color: var(--fg); }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { grid-column: 2; color: var(--mut); font-size: 11.5px; margin-top: -4px; }
  .err { grid-column: 1 / -1; color: var(--err); min-height: 1em; }
  footer { display: flex; align-items: center; gap: 8px; padding: 10px 16px 14px; }
  footer label { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 12px; margin-right: auto; }
  button { font: inherit; padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <img src="icons/48.png" alt="">
  <span class="name">Download file info</span>
</header>
<main>
  <span class="k">Address</span><span class="v" id="url">—</span>
  <span class="k">Save as</span><input type="text" id="name" spellcheck="false" autocomplete="off">
  <span class="k">Folder</span><span class="v" id="dir">reIDM's download folder</span>
  <span class="hint">Change it in reIDM's Options.</span>
  <span class="k">Size</span><span class="v" id="size">checking…</span>
  <span class="err" id="err"></span>
</main>
<footer>
  <label><input type="checkbox" id="noAsk"> Don't ask again</label>
  <button id="cancel">Cancel</button>
  <button id="later">Download later</button>
  <button id="start" class="primary">Start download</button>
</footer>
<script src="confirm.js"></script>
</body>
</html>
