name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo install cargo-deb --locked --version 2.7.0
      - run: cargo deb -p reidm --no-build --output dist/
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v"); if (-not $v -or $v -eq "main") { $v = "0.0.0" }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=$v" packaging\windows\reidm.iss
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: dist/*.exe }

  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "x86_64-apple-darwin,aarch64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin; do cargo build --release --locked --target $t; done
          mkdir -p dist universal
          for b in reidm reidm-host; do
            lipo -create -output universal/$b target/x86_64-apple-darwin/release/$b target/aarch64-apple-darwin/release/$b
          done
          V="${GITHUB_REF_NAME#v}"
          packaging/macos/make-dmg.sh "$V" universal/reidm universal/reidm-host "dist/reIDM-$V-universal.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: dmg, path: dist/*.dmg }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-deb, windows-exe, macos-dmg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "reIDM ${{ github.ref_name }}" --notes-file - <<'EON'
          Cross-platform Rust download manager that speaks the IDM browser-extension protocol.

          * `reIDM-setup-*.exe` – Windows installer (registers the native host, starts the daemon at login)
          * `reidm_*_amd64.deb` – Debian/Ubuntu (system-wide native-host manifests, systemd user unit)
          * `reIDM-*-universal.dmg` – macOS (Intel + Apple silicon; unsigned, see README for Gatekeeper)

          Read docs/EXTENSION.md: the official extension only runs unmodified on Windows.
          EON
