name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo install cargo-deb --locked --version 2.7.0
      - run: cargo deb -p reidm --no-build --output dist/
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v"); if (-not $v -or $v -eq "main") { $v = "0.0.0" }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=$v" packaging\windows\reidm.iss
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: dist/*.exe }

  macos-dmg:
    runs-on: macos-14
    env:
      # `secrets` is not available in a step's `if`, so surface them as job-level env
      # and test those. All are empty on a repository without them and the steps skip.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
      MACOS_APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "x86_64-apple-darwin,aarch64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Optional: Developer ID signing. Both steps no-op when the secrets are absent, so the
      # build still succeeds ad-hoc signed — see docs/PACKAGING.md.
      - name: Import the signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm -f cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Store the notarization credentials
        if: ${{ env.MACOS_APPLE_ID != '' }}
        run: |
          xcrun notarytool store-credentials reidm-notary \
            --apple-id "$MACOS_APPLE_ID" --password "$MACOS_APPLE_PASSWORD" --team-id "$MACOS_TEAM_ID"
      - name: Build the DMG
        env:
          # Only notarize when both a certificate and notary credentials were provided.
          MACOS_NOTARY_PROFILE: "${{ env.MACOS_CERT_P12 != '' && env.MACOS_APPLE_ID != '' && 'reidm-notary' || '' }}"
        run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin; do cargo build --release --locked --target $t; done
          mkdir -p dist universal
          for b in reidm reidm-host reidm-gui; do
            lipo -create -output universal/$b target/x86_64-apple-darwin/release/$b target/aarch64-apple-darwin/release/$b
          done
          V="${GITHUB_REF_NAME#v}"
          packaging/macos/make-dmg.sh "$V" universal/reidm universal/reidm-host universal/reidm-gui "dist/reIDM-$V-universal.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: dmg, path: dist/*.dmg }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-deb, windows-exe, macos-dmg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "reIDM ${{ github.ref_name }}" --notes-file - <<'EON'
          Cross-platform Rust download manager with a native desktop app, speaking the IDM browser-extension protocol.

          * `reIDM-setup-*.exe` – Windows installer (registers the native host, starts the daemon at login)
          * `reidm_*_amd64.deb` – Debian/Ubuntu (desktop entry, system-wide native-host manifests, systemd user unit)
          * `reIDM-*-universal.dmg` – macOS app bundle (Intel + Apple silicon; unsigned, see README for Gatekeeper)

          The window is a front-end for the background service, so downloads keep running when it is closed.
          Read docs/EXTENSION.md: the official extension only runs unmodified on Windows.
          EON
