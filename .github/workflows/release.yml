name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo install cargo-deb --locked --version 2.7.0
      - run: cargo deb -p reidm --no-build --output dist/
      - name: Browser extension zips
        run: |
          V="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || V="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)-dev"
          node tools/build-firefox-extension.mjs
          (cd extension && zip -r -X "../dist/reidm-extension-$V.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: "dist/*" }

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          # A manual run on a branch builds a test installer; only tags are versioned releases.
          # Name the test build after the workspace version, as the macOS job does.
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.ref_type }}" -ne "tag") {
            $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
            $v = "$ver-dev"
          }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=$v" packaging\windows\reidm.iss
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: dist/*.exe }

  macos-dmg:
    runs-on: macos-14
    env:
      # `secrets` is not available in a step's `if`, so surface them as job-level env
      # and test those. All are empty on a repository without them and the steps skip.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
      MACOS_APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "x86_64-apple-darwin,aarch64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Optional: Developer ID signing. Both steps no-op when the secrets are absent, so the
      # build still succeeds ad-hoc signed — see docs/PACKAGING.md.
      - name: Import the signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm -f cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Store the notarization credentials
        if: ${{ env.MACOS_APPLE_ID != '' }}
        run: |
          xcrun notarytool store-credentials reidm-notary \
            --apple-id "$MACOS_APPLE_ID" --password "$MACOS_APPLE_PASSWORD" --team-id "$MACOS_TEAM_ID"
      # Lays out the disk image's window; see packaging/macos/dmg-settings.py.
      - run: pipx install dmgbuild
      - name: Build the DMG
        env:
          # Only notarize when both a certificate and notary credentials were provided.
          MACOS_NOTARY_PROFILE: "${{ env.MACOS_CERT_P12 != '' && env.MACOS_APPLE_ID != '' && 'reidm-notary' || '' }}"
        run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin; do cargo build --release --locked --target $t; done
          mkdir -p dist universal
          for b in reidm reidm-host reidm-gui; do
            lipo -create -output universal/$b target/x86_64-apple-darwin/release/$b target/aarch64-apple-darwin/release/$b
          done
          V="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || V="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)-dev"
          packaging/macos/make-dmg.sh "$V" universal/reidm universal/reidm-host universal/reidm-gui "dist/reIDM-$V-universal.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: dmg, path: dist/*.dmg }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-deb, windows-exe, macos-dmg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PRE=""
          case "${{ github.ref_name }}" in *-*) PRE="--prerelease" ;; esac
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "reIDM ${GITHUB_REF_NAME#v}" --notes-file - $PRE <<'EON'
          A cross-platform download manager that takes over your browser's downloads. See CHANGELOG.md for what is new.

          * `reIDM-setup-*.exe` – Windows installer (the app, the browser extension, native hosts, start at login)
          * `reidm_*_amd64.deb` – Debian/Ubuntu (desktop entry, the browser extension, native hosts, systemd user unit)
          * `reIDM-*-universal.dmg` – macOS app bundle (Intel + Apple silicon; drag it to Applications; ad-hoc signed unless a Developer ID is configured)
          * `reidm-extension-*.zip` – the browser extension on its own, for Chrome, Edge, Brave, Vivaldi and Opera
          * `reidm-extension-firefox-*.zip` – the same extension for Firefox 128 and later (load it from about:debugging, or sign it for a permanent install)

          Install the app, then load the extension once: open the reIDM window and choose Help › Browser integration.
          The window is a front-end for the background service, so downloads keep running when it is closed.
          EON
