name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-22.04, windows-2022, macos-14] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The desktop app links against the windowing and GL stack, which the runner images
      # do not install by default.
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
