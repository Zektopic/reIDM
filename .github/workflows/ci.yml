name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-22.04, windows-2022, macos-14] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
