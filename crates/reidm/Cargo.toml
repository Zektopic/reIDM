[package]
name = "reidm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "reIDM: cross-platform download manager compatible with the IDM browser extension"

[[bin]]
name = "reidm"
path = "src/main.rs"

[dependencies]
reidm-core = { path = "../reidm-core" }
reidm-proto = { path = "../reidm-proto" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
clap.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
axum.workspace = true
reqwest.workspace = true

[package.metadata.deb]
name = "reidm"
maintainer = "Zektopic <opensource@zektopic.invalid>"
copyright = "reIDM contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Cross-platform download manager (segmented, resumable) that speaks the IDM browser-extension protocol. Not affiliated with Tonec."
section = "net"
priority = "optional"
# `$auto` picks up the shared libraries the binaries link against; these are the GUI's, which are
# loaded through the windowing stack rather than always appearing in the ELF dependency list.
depends = "$auto, libxkbcommon0, libgl1 | libgl1-mesa-glx, libxcb1, libwayland-client0, libfontconfig1"
assets = [
  ["../../target/release/reidm", "usr/bin/reidm", "755"],
  ["../../target/release/reidm-host", "usr/bin/reidm-host", "755"],
  ["../../target/release/reidm-gui", "usr/bin/reidm-gui", "755"],
  ["../../packaging/linux/reidm.desktop", "usr/share/applications/reidm.desktop", "644"],
  ["../../packaging/icon/reidm-256.png", "usr/share/icons/hicolor/256x256/apps/reidm.png", "644"],
  ["../../packaging/icon/reidm-512.png", "usr/share/icons/hicolor/512x512/apps/reidm.png", "644"],
  ["../../packaging/linux/reidm.service", "usr/lib/systemd/user/reidm.service", "644"],
  ["../../packaging/linux/com.tonec.idm.chromium.json", "etc/opt/chrome/native-messaging-hosts/com.tonec.idm.json", "644"],
  ["../../packaging/linux/com.tonec.idm.chromium.json", "etc/chromium/native-messaging-hosts/com.tonec.idm.json", "644"],
  ["../../packaging/linux/com.tonec.idm.chromium.json", "etc/opt/edge/native-messaging-hosts/com.tonec.idm.json", "644"],
  ["../../packaging/linux/com.tonec.idm.firefox.json", "usr/lib/mozilla/native-messaging-hosts/com.tonec.idm.json", "644"],
  # reIDM's own extension, and the host it uses to start reIDM on demand.
  ["../../extension/*.js", "usr/share/reidm/extension/", "644"],
  ["../../extension/*.html", "usr/share/reidm/extension/", "644"],
  ["../../extension/*.json", "usr/share/reidm/extension/", "644"],
  ["../../extension/*.md", "usr/share/reidm/extension/", "644"],
  ["../../extension/icons/*.png", "usr/share/reidm/extension/icons/", "644"],
  ["../../packaging/linux/com.zektopic.reidm.json", "etc/opt/chrome/native-messaging-hosts/com.zektopic.reidm.json", "644"],
  ["../../packaging/linux/com.zektopic.reidm.json", "etc/chromium/native-messaging-hosts/com.zektopic.reidm.json", "644"],
  ["../../packaging/linux/com.zektopic.reidm.json", "etc/opt/edge/native-messaging-hosts/com.zektopic.reidm.json", "644"],
  ["../../docs/*.md", "usr/share/doc/reidm/", "644"],
  ["../../CHANGELOG.md", "usr/share/doc/reidm/CHANGELOG.md", "644"],
  ["../../README.md", "usr/share/doc/reidm/README.md", "644"],
]
